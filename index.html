<style>

  --page:#EFE7D8; --card:#FBF7F0;
  --green:#22B558; --green-d:#0E7A3C; --green-w:#E4F1E2;
  --red:#C63F3F; --red-w:#F7E3E1;
  --sh-s:0 1px 2px rgba(60,40,20,.06);
  --sh-m:0 1px 3px rgba(60,40,20,.07), 0 10px 26px -16px rgba(60,40,20,.32);

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#F1E7D9; --ink-2:#C3B29B; --ink-3:#8E7C67;
    --line:#3A2E22; --line-2:#2A2119;
    --page:#171109; --card:#221A11;
    --green:#2FBF67; --green-d:#8FDDAC; --green-w:#1B2C1B;

    --sh-m:0 1px 3px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.85);
    --sh-pop:0 -6px 30px -12px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ink:#F1E7D9; --ink-2:#C3B29B; --ink-3:#8E7C67;
  --line:#3A2E22; --line-2:#2A2119;
  --page:#171109; --card:#221A11;
  --green:#2FBF67; --green-d:#8FDDAC; --green-w:#1B2C1B;
  --red:#E37272; --red-w:#33191A;

  --sh-m:0 1px 3px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.85);

}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--card);box-shadow:var(--sh-m)}
@media(min-width:560px){.wrap{margin:22px auto;min-height:0;border-radius:20px;overflow:hidden;border:1px solid var(--line)}}

/* header toko */
.shop{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
.ava{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:22px;background:linear-gradient(155deg,#F6E3C9,#E7C69B)}
.shop .nm{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:17px;letter-spacing:-.02em}
.shop .sb{font-size:12.5px;color:var(--ink-3)}
.wadot{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--green-w);color:var(--green-d);display:grid;place-items:center;flex:none}
.wadot svg{width:19px;height:19px}

.banner{position:relative;overflow:hidden;margin:0 16px;border-radius:15px;padding:20px;color:#fff;background:linear-gradient(115deg,#3A2216,#6A3C22 52%,#8B5830)}
.banner h3{font-size:21px;line-height:1.15;letter-spacing:-.02em;font-weight:800;max-width:12ch}
.banner p{margin:7px 0 0;font-size:12.5px;opacity:.84;max-width:26ch;line-height:1.45}

.cats{display:flex;gap:8px;padding:16px 16px 2px;overflow-x:auto;scrollbar-width:none}

.cats button{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);background:var(--card)}

.sech{padding:18px 16px 10px;font-size:15px;font-weight:700;letter-spacing:-.015em;font-family:"Plus Jakarta Sans",sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 120px}
.prod{border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column;background:var(--card)}

.li .t{font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:14px}

label.fl{display:block;margin:15px 0 6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fi{width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:15px}

.tot{margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:8px}

.stick{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:520px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:var(--sh-pop)}
.gbtn{width:100%;padding:15px;border-radius:13px;background:var(--green);color:#fff;font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none}
.gbtn svg{width:19px;height:19px}
.gbtn[disabled],.gbtn.off{opacity:.45;pointer-events:none}
.gbtn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line);margin-top:9px;font-size:14px;padding:12px}
.hintline{margin-top:10px;font-size:11.5px;color:var(--ink-3);text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.hintline svg{width:13px;height:13px}

.okmark{width:66px;height:66px;border-radius:50%;background:var(--green);color:#fff;margin:26px auto 16px;display:grid;place-items:center}
.okmark svg{width:32px;height:32px}
.ok-h{font-size:22px;font-weight:800;letter-spacing:-.025em;text-align:center;line-height:1.2;font-family:"Plus Jakarta Sans",sans-serif}
.ok-p{font-size:13.5px;color:var(--ink-3);text-align:center;margin:10px auto 20px;max-width:30ch;line-height:1.5}
.recap{border:1px solid var(--line);border-radius:14px;padding:15px}
.recap h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600;font-family:Inter,sans-serif;margin-bottom:10px}
.recap .tot{margin:0;padding:0;border:0}
.preview{margin-top:14px;border-radius:14px;padding:13px 14px;background:var(--green-w);border:1px solid color-mix(in srgb,var(--green) 28%,transparent);font-size:12.5px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;max-height:190px;overflow:auto}
.payinfo{margin-top:12px;font-size:12.5px;color:var(--ink-2);background:var(--line-2);border-radius:12px;padding:12px 13px;line-height:1.5}

/* admin */
.abar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--line-2)}
.abar h2{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.abar .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-d);background:var(--green-w);padding:4px 9px;border-radius:999px}
.atabs{display:flex;gap:3px;padding:12px 16px 0}
.atabs button{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-3);border:1px solid transparent}
.atabs button[aria-selected="true"]{background:var(--green-w);color:var(--green-d);border-color:var(--green)}
.acard{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:12px}
.acard .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.acard .hd .e{width:38px;height:38px;border-radius:11px;background:var(--line-2);display:grid;place-items:center;font-size:19px;flex:none}
.acard .hd .t{font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:14px;flex:1}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini2 .fi{padding:9px 11px;font-size:14px}
.iconbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:14px}
.iconbtn.del:hover{color:var(--red);border-color:var(--red)}
.switch{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.switch input{accent-color:var(--green);width:16px;height:16px}
.addbtn{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:1px dashed var(--line);color:var(--ink-2);font-weight:600;font-size:14px}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:60;
  background:var(--ink);color:var(--page);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
  transition:transform .3s cubic-bezier(.3,1.2,.5,1);max-width:90vw;text-align:center;
}
.toast.on{transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:14px}
.adminlink{display:block;text-align:center;padding:22px 16px 34px;font-size:12px;color:var(--ink-3)}

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const rp = n => "Rp" + Number(n||0).toLocaleString("id-ID");
const el = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const BAKED = JSON.parse(el("shop-data").textContent);
const KEY_DATA = "waorder:data:v1";
const KEY_CART = "waorder:cart:v1";
const KEY_BUYER = "waorder:buyer:v1";

const load = (k, fb) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } };
const save = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

// Data toko: versi hasil edit admin di perangkat ini menang; kalau tidak ada, pakai yang tertanam di file.
let DATA = load(KEY_DATA, null) || structuredClone(BAKED);
let cart = load(KEY_CART, {});
let buyer = load(KEY_BUYER, {nama:"", wa:"", alamat:"", catatan:"", ongkir:0});
let screen = "katalog", kategori = "Semua", tried = false, adminTab = "produk";

function toast(msg){
  const t = el("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), 2200);
}

/* ---------- hitung ---------- */
const aktif = () => DATA.produk.filter(p => p.aktif !== false);
const cariProduk = id => DATA.produk.find(p => p.id === id);
const isiKeranjang = () => Object.entries(cart)
  .map(([id,q]) => { const p = cariProduk(id); return p ? {...p, q} : null; })
  .filter(Boolean);
const jumlah = () => isiKeranjang().reduce((a,i)=>a+i.q,0);
const subtotal = () => isiKeranjang().reduce((a,i)=>a+i.harga*i.q,0);
const ongkirDipilih = () => DATA.ongkir[buyer.ongkir] || DATA.ongkir[0] || {nama:"—", harga:0};
const total = () => subtotal() + (jumlah() ? ongkirDipilih().harga : 0);

function setCart(id, q){
  if(q <= 0) delete cart[id]; else cart[id] = q;
  save(KEY_CART, cart); render();
}

/* ---------- nomor & pesan WhatsApp ---------- */
function noWA(){
  let d = String(DATA.shop.wa||"").replace(/\D/g,"");
  if(d.startsWith("0")) d = "62" + d.slice(1);
  else if(d.startsWith("620")) d = "62" + d.slice(3);
  else if(d && !d.startsWith("62")) d = "62" + d;
  return d;
}
function kodeOrder(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())}${p(d.getMonth()+1)}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function pesanWA(kode){
  const o = ongkirDipilih();
  return [
    `*ORDER BARU — ${DATA.shop.nama}*`,
    `No. order: ${kode}`, "",
    ...isiKeranjang().map(i => `• ${i.nama} ×${i.q} — ${rp(i.harga*i.q)}`), "",
    `Subtotal: ${rp(subtotal())}`,
    `Ongkir (${o.nama}): ${o.harga ? rp(o.harga) : "Gratis"}`,
    `*Total: ${rp(total())}*`, "",
    `Nama: ${buyer.nama || "—"}`,
    `WhatsApp: ${buyer.wa || "—"}`,
    `Alamat: ${buyer.alamat || "—"}`,
    `Catatan: ${buyer.catatan || "—"}`
  ].join("\n");
}

/* ---------- ikon ---------- */

const IC_CART = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 11.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/></svg>`;

/* ---------- render ---------- */
function render(){
  const app = el("app");
  bersihkanBar();
  if(screen === "admin"){ app.innerHTML = viewAdmin(); pasangAdmin(); return; }

  app.innerHTML =
    screen === "gate"       ? viewGate() :
    screen === "keranjang"  ? viewKeranjang() :
    screen === "data"       ? viewData() :
    screen === "konfirmasi" ? viewKonfirmasi() :
    screen === "selesai"    ? viewSelesai() :
                              viewKatalog();

  if(screen === "katalog"){
    const n = jumlah();
    const bar = document.createElement("div");
    bar.className = "cartbar";
    bar.innerHTML = `<button class="in" type="button" data-go="keranjang">
        <span class="ic">${IC_CART}<span class="bdg num">${n}</span></span>
        <span><span class="lb">Lihat Keranjang</span><span class="am num">${rp(subtotal())}</span></span>
        <span class="go">›</span>
      </button>`;
    if(!n) bar.hidden = true;
    document.body.appendChild(bar);
  }
  if(screen === "data") pasangFormData();
  if(screen === "admin") pasangAdmin();
  if(screen === "gate") pasangGate();
}

function pasangGate(){
  const masuk = () => {
    const pin = String(DATA.shop.pin ?? "1234");
    if(el("i-pin").value.trim() === pin){ screen = "admin"; window.scrollTo(0,0); render(); }
    else { el("e-pin").hidden = false; el("i-pin").classList.add("err"); }
  };
  el("masuk").addEventListener("click", masuk);
  el("i-pin").addEventListener("keydown", e => { if(e.key === "Enter") masuk(); });
}

function bersihkanBar(){ document.querySelectorAll(".cartbar").forEach(b => b.remove()); }

function go(s){
  bersihkanBar();
  if(s === "konfirmasi" && !validasi()) return;
  if(s !== "konfirmasi") viewKonfirmasi.kode = null;
  screen = s; tried = false;
  window.scrollTo(0,0);
  render();
}

/* form data pembeli */
function pasangFormData(){
  [["i-nama","nama"],["i-wa","wa"],["i-alamat","alamat"],["i-catatan","catatan"]].forEach(([id,k]) => {
    const n = el(id);
    n.addEventListener("input", () => { buyer[k] = n.value; save(KEY_BUYER, buyer); if(tried) validasi(); });
  });
  document.querySelectorAll('input[name="ongkir"]').forEach(r => {
    r.addEventListener("change", () => { buyer.ongkir = Number(r.value); save(KEY_BUYER, buyer); render(); });
  });
}
function validasi(){
  tried = true;
  const cek = [
    ["i-nama","e-nama", v => v.trim().length > 0],
    ["i-wa","e-wa", v => v.replace(/\D/g,"").length >= 9],
    ["i-alamat","e-alamat", v => v.trim().length > 0]
  ];
  let ok = true, first = null;
  cek.forEach(([id,eid,fn]) => {
    const n = el(id); if(!n) return;
    const good = fn(n.value);
    n.classList.toggle("err", !good);
    el(eid).hidden = good;
    if(!good){ ok = false; first = first || n; }
  });
  if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
  return ok;
}

/* admin: simpan tiap ketikan */
function simpanData(){ save(KEY_DATA, DATA); }
function pasangAdmin(){
  document.querySelectorAll("[data-p]").forEach(n => {
    const [i,k] = n.dataset.p.split(":");
    n.addEventListener(n.type === "checkbox" ? "change" : "input", () => {
      const p = DATA.produk[i];
      p[k] = n.type === "checkbox" ? n.checked : (k === "harga" ? Number(String(n.value).replace(/\D/g,"")||0) : n.value);
      simpanData();
    });
  });
  document.querySelectorAll("[data-s]").forEach(n => {
    n.addEventListener("input", () => { DATA.shop[n.dataset.s] = n.value; simpanData(); });
  });
  document.querySelectorAll("[data-o]").forEach(n => {
    const [i,k] = n.dataset.o.split(":");
    n.addEventListener("input", () => {
      DATA.ongkir[i][k] = k === "harga" ? Number(String(n.value).replace(/\D/g,"")||0) : n.value;
      simpanData();
    });
  });

  el("tambah")?.addEventListener("click", () => {
    DATA.produk.push({id:"p"+Date.now(), nama:"", ket:"", harga:0, emoji:"🍽", kategori:"Lainnya", aktif:true});
    simpanData(); render();
  });
  el("tambahongkir")?.addEventListener("click", () => {
    DATA.ongkir.push({nama:"", estimasi:"", harga:0}); simpanData(); render();
  });
  el("unduh")?.addEventListener("click", unduhData);
  el("salin")?.addEventListener("click", async () => {
    try{ await navigator.clipboard.writeText(JSON.stringify(DATA, null, 2)); toast("Data toko tersalin"); }
    catch(e){ toast("Gagal menyalin — pakai tombol Unduh"); }
  });
  el("reset")?.addEventListener("click", () => {
    if(!confirm("Kembalikan semua data ke versi yang tertanam di halaman ini? Perubahan kamu akan hilang.")) return;
    DATA = structuredClone(BAKED);
    try{ localStorage.removeItem(KEY_DATA); }catch(e){}
    render(); toast("Data dikembalikan");
  });
}

async function unduhData(){
  const isi = JSON.stringify(DATA, null, 2);
  const nama = "data-toko.json";
  try{
    const dl = await window.claude?.use?.("downloads");
    if(dl){ await dl.save({filename:nama, data:isi}); toast("File data-toko.json tersimpan"); return; }
  }catch(e){}
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([isi], {type:"application/json"}));
    a.download = nama; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast("File data-toko.json diunduh");
  }catch(e){ toast("Tidak bisa mengunduh — pakai tombol Salin"); }
}

/* ---------- event global ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-q],[data-go],[data-kat],[data-atab],[data-hapus],[data-hapusongkir]");
  if(!t) return;

  if(t.dataset.q){ const [id,q] = t.dataset.q.split(":"); setCart(id, Number(q)); return; }
  if(t.dataset.kat){ kategori = t.dataset.kat; bersihkanBar(); render(); return; }
  if(t.dataset.atab){ adminTab = t.dataset.atab; render(); return; }
  if(t.dataset.hapus !== undefined){
    const i = Number(t.dataset.hapus);
    if(confirm(`Hapus produk "${DATA.produk[i].nama || "tanpa nama"}"?`)){ DATA.produk.splice(i,1); simpanData(); render(); }
    return;
  }
  if(t.dataset.hapusongkir !== undefined){
    const i = Number(t.dataset.hapusongkir);
    if(confirm(`Hapus opsi kirim "${DATA.ongkir[i].nama || "tanpa nama"}"?`)){ DATA.ongkir.splice(i,1); simpanData(); render(); }
    return;
  }
  if(t.dataset.go) go(t.dataset.go);
});

document.addEventListener("click", e => {
  if(!e.target.closest("#kirim")) return;
  setTimeout(() => {
    cart = {}; save(KEY_CART, cart);
    bersihkanBar(); screen = "selesai"; viewKonfirmasi.kode = null;
    window.scrollTo(0,0); render();
  }, 400);
});

render();
</script>
